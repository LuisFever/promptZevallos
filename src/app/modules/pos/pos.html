<div class="flex h-[calc(100vh-64px)] bg-slate-100 overflow-hidden">

    <div class="flex-1 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-slate-800">Punto de Venta</h1>
            <div class="relative">
                <input type="text" placeholder="Escanear código..." class="pl-10 pr-4 py-2 rounded-xl border-none shadow-sm focus:ring-2 focus:ring-indigo-500 w-64">
                <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
            </div>
        </div>

        <div class="flex gap-2 mb-6">
            <button *ngFor="let cat of categorias" class="px-5 py-2 rounded-full bg-white text-slate-600 font-bold text-xs shadow-sm hover:bg-indigo-600 hover:text-white transition-all">
        {{cat}}
      </button>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <div *ngFor="let p of productos" class="bg-white p-4 rounded-3xl shadow-sm border border-transparent hover:border-indigo-500 transition-all cursor-pointer group">
                <div class="text-3xl mb-2">{{p.icon}}</div>
                <h3 class="font-bold text-slate-800 text-sm mb-1">{{p.nombre}}</h3>
                <div class="flex justify-between items-end">
                    <p class="text-indigo-600 font-black text-lg">S/ {{p.precio | number:'1.2-2'}}</p>
                    <p class="text-[10px] font-bold text-slate-400">Stock: {{p.stock}}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="w-96 bg-white border-l border-slate-200 flex flex-col shadow-2xl">
        <div class="p-6 border-b border-slate-100">
            <h2 class="font-black text-slate-800 uppercase tracking-tighter flex justify-between">
                Orden Actual <span class="text-indigo-600">#0042</span>
            </h2>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-100">
                <div class="flex items-center gap-3">
                    <span class="text-xl">🍺</span>
                    <div>
                        <p class="text-xs font-black text-slate-800">Cerveza Personal</p>
                        <p class="text-[10px] text-slate-500 font-bold">S/ 8.00 x 2</p>
                    </div>
                </div>
                <p class="font-black text-slate-800 text-sm">S/ 16.00</p>
            </div>

            <div class="hidden flex flex-col items-center justify-center h-full text-slate-300">
                <span class="text-5xl mb-2">🛒</span>
                <p class="font-bold">Carrito vacío</p>
            </div>
        </div>

        <div class="p-6 bg-slate-50 border-t border-slate-100 space-y-4">
            <div class="space-y-2">
                <div class="flex justify-between text-slate-500 font-bold text-sm">
                    <span>Subtotal</span> <span>S/ 16.00</span>
                </div>
                <div class="flex justify-between text-slate-500 font-bold text-sm">
                    <span>IGV (18%)</span> <span>S/ 2.88</span>
                </div>
                <div class="flex justify-between text-slate-900 font-black text-2xl pt-2 border-t border-slate-200">
                    <span>Total</span> <span>S/ 18.88</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button class="bg-white border border-slate-200 p-3 rounded-2xl text-xs font-black hover:bg-slate-100 transition">EFECTIVO</button>
                <button class="bg-white border border-slate-200 p-3 rounded-2xl text-xs font-black hover:bg-slate-100 transition">TARJETA / YAPE</button>
            </div>

            <button class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-sm shadow-xl shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all uppercase tracking-widest">
        Cobrar e Imprimir
      </button>
        </div>
    </div>
</div>
